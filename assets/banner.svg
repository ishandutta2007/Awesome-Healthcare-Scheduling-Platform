<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#173e65"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>

    <!-- Medical Pulse Line Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#glow-teal)">
    <animate attributeName="r" values="160;200;160" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;110;90" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="1000" cy="220" r="220" fill="url(#glow-blue)">
    <animate attributeName="r" values="200;240;200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="980;1020;980" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Background Grid Pattern for Tech Aesthetic -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>

    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Animated EKG Pulse Wave Line -->
  <path d="M 0 250 H 300 L 320 250 L 330 210 L 345 290 L 360 170 L 375 260 L 390 240 L 400 250 H 1200" 
        fill="none" stroke="url(#pulse-grad)" stroke-width="3.5" stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" values="1200;0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Floating Decorative Icons in Midground (Opacity controlled) -->
  <!-- Calendar Icon -->
  <g transform="translate(920, 50)" opacity="0.15">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="none" stroke="#00f2fe" stroke-width="6"/>
    <line x1="0" y1="30" x2="100" y2="30" stroke="#00f2fe" stroke-width="6"/>
    <circle cx="30" cy="55" r="6" fill="#00f2fe"/>
    <circle cx="50" cy="55" r="6" fill="#00f2fe"/>
    <circle cx="70" cy="55" r="6" fill="#00f2fe"/>
    <circle cx="30" cy="75" r="6" fill="#00f2fe"/>
    <circle cx="50" cy="75" r="6" fill="#00f2fe"/>
    <animateTransform attributeName="transform" type="translate" values="920,50; 920,40; 920,50" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- Cross / Healthcare Symbol -->
  <g transform="translate(120, 60)" opacity="0.12">
    <path d="M 35 0 H 65 V 35 H 100 V 65 H 65 V 100 H 35 V 65 H 0 V 35 H 35 Z" fill="#38ef7d"/>
    <animateTransform attributeName="transform" type="translate" values="120,60; 120,72; 120,60" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- FOREGROUND TEXT CONTENT (High contrast, clearly legible) -->
  <!-- Healthcare Cross Badge -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="2"/>
    <path d="M 22 12 H 32 V 22 H 42 V 32 H 32 V 42 H 22 V 32 H 12 V 22 H 22 Z" fill="#00f2fe"/>
  </g>

  <!-- Main Title -->
  <text x="134" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Healthcare Scheduling Platform
  </text>

  <!-- Subtitle -->
  <text x="134" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a0aec0">
    Curated SaaS Platforms, Provider Calendars &amp; HIPAA-Ready Open-Source Ecosystem
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(134, 198)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00f2fe">📅 Patient Booking</text>

    <!-- Pill 2 -->
    <rect x="177" y="0" width="180" height="32" rx="16" fill="#38ef7d" fill-opacity="0.12" stroke="#38ef7d" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="191" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38ef7d">👨‍⚕️ Provider Scheduling</text>

    <!-- Pill 3 -->
    <rect x="369" y="0" width="170" height="32" rx="16" fill="#4facfe" fill-opacity="0.12" stroke="#4facfe" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="383" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4facfe">🔒 Open-Source EHR</text>
  </g>
</svg>
